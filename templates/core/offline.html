<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline · tutor-en</title>
<style>
  /* Self-contained on purpose: this page is shown when nothing else loads. */
  :root{--bg:#1a1e27;--panel:#222733;--line:#343b4b;--ink:#ece9e2;--ink-2:#a9aeb9;--amber:#e5b35a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,sans-serif}
  main{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px}
  .brand{font-weight:600;letter-spacing:.02em;margin-bottom:18px}
  .brand span{color:var(--amber)}
  h1{font:500 30px/1.15 "Newsreader",Georgia,"Times New Roman",serif;margin-bottom:10px}
  p{color:var(--ink-2);margin-bottom:22px}
  button{font:inherit;font-weight:600;color:var(--bg);background:var(--amber);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="brand">tutor<span>-en</span></div>
  <h1>You're offline</h1>
  <p>The tutor needs a connection to prepare lessons, listen to you and correct your writing. Check your network and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>
  // Same registration as app.js, so landing here still installs the app.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
