{% extends "base.html" %}

{% block content %}
<div class="head">
  <div><h1>{{ title }}</h1><p>All four parts are in. Placing your level takes about twenty seconds.</p></div>
</div>
<div class="card" id="analysis-box"
     hx-post="{% url 'lessons:checkpoint_finish' lesson.id %}"
     hx-trigger="load"
     hx-target="#analysis-box"
     hx-swap="innerHTML"
     hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="spinner-wrap">
    <div class="spinner" aria-hidden="true"></div>
    <p class="hint">Reading your answers, your text and the interview against the CEFR descriptors…</p>
  </div>
</div>
{% endblock %}

{% block head %}
<style>
  .spinner-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 0}
  .spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
{% endblock %}
