{% extends "base.html" %}

{% block content %}
<div class="head">
  <div><h1>Lesson finished</h1><p>{{ lesson.title }} · {{ lesson.turns.count }} turns · {{ lesson.duration_seconds|default:0 }} seconds</p></div>
</div>
<div class="card">
  <h3>Report</h3>
  <div class="empty">The post-lesson analysis and report arrive in the next module. Your turns are saved.</div>
  <p style="margin-top:14px"><a class="btn" href="{% url 'core:today' %}">Back to Today</a></p>
</div>
{% endblock %}
